# Checks on every push to main and on every pull request: types, tests and a production build.
# Free for public repositories; for a private repository the free plan includes 2,000 minutes a month
# (one run takes a few minutes), and runs stop (no charge) when the minutes are used up and no card is on file.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types (site and tests)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Known critical security problems in dependencies
        run: npm audit --omit=dev --audit-level=critical
