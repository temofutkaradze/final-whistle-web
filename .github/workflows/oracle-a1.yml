
name: Oracle A1 - Auto Provision

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install OCI CLI
        run: python3 -m pip install --user oci-cli

      - name: Configure Oracle credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          {
            echo '[DEFAULT]'
            echo "user=$OCI_USER_OCID"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > "$HOME/.oci/config"

          chmod 600 "$HOME/.oci/config"

      - name: Check existing instances and launch
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          ROOT = os.environ["OCI_TENANCY_OCID"]
          COMPARTMENT = os.environ["OCI_COMPARTMENT_OCID"]
          SUBNET = os.environ["OCI_SUBNET_OCID"]
          IMAGE = os.environ["OCI_IMAGE_OCID"]
          SSH_KEY = os.environ["OCI_SSH_PUBLIC_KEY"].strip()

          NAME = "final-whistle-server"
          SHAPE = "VM.Standard.A1.Flex"

          def run_oci(*args):
              command = ["oci", *args, "--output", "json"]
              result = subprocess.run(
                  command,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(
                      "OCI command failed:",
                      " ".join(args[:3]),
                      file=sys.stderr
                  )
                  print(result.stderr, file=sys.stderr)
                  raise RuntimeError("Oracle CLI request failed")

              output = result.stdout.strip()

              if not output:
                  raise RuntimeError(
                      "Oracle CLI returned an empty response"
                  )

              try:
                  return json.loads(output)
              except json.JSONDecodeError:
                  print(
                      "Oracle CLI returned unexpected output:",
                      output[:500],
                      file=sys.stderr
                  )
                  raise

          def existing_instances(compartment_id):
              response = run_oci(
                  "compute", "instance", "list",
                  "--compartment-id", compartment_id,
                  "--all"
              )
              return response.get("data", [])

          def check_duplicates():
              for compartment_id in dict.fromkeys(
                  [ROOT, COMPARTMENT]
              ):
                  instances = existing_instances(compartment_id)

                  for instance in instances:
                      if (
                          instance.get("display-name") == NAME
                          and instance.get("lifecycle-state")
                          not in ("TERMINATED", "TERMINATING")
                      ):
                          print(
                              "Server already exists:",
                              instance.get("display-name"),
                              instance.get("lifecycle-state")
                          )
                          return True

              return False

          def launch(ad, metadata_path):
              command = [
                  "oci", "compute", "instance", "launch",
                  "--compartment-id", COMPARTMENT,
                  "--availability-domain", ad,
                  "--display-name", NAME,
                  "--shape", SHAPE,
                  "--shape-config",
                  '{"ocpus":2,"memoryInGBs":12}',
                  "--image-id", IMAGE,
                  "--subnet-id", SUBNET,
                  "--assign-public-ip", "true",
                  "--boot-volume-size-in-gbs", "50",
                  "--metadata", "file://" + metadata_path,
                  "--output", "json"
              ]

              return subprocess.run(
                  command,
                  text=True,
                  capture_output=True
              )

          if not SSH_KEY.startswith("ssh-ed25519 "):
              raise RuntimeError(
                  "OCI_SSH_PUBLIC_KEY is not a valid "
                  "ED25519 public key"
              )

          print("Checking for an existing server...", flush=True)

          if check_duplicates():
              print("Skipping: duplicate prevention.")
              sys.exit(0)

          print("Checking subnet and image...", flush=True)

          run_oci(
              "network", "subnet", "get",
              "--subnet-id", SUBNET
          )

          run_oci(
              "compute", "image", "get",
              "--image-id", IMAGE
          )

          print("Reading availability domains...", flush=True)

          response = run_oci(
              "iam", "availability-domain", "list",
              "--compartment-id", ROOT
          )

          domains = response.get("data", [])

          if not domains:
              raise RuntimeError(
                  "No availability domains found"
              )

          metadata = {
              "ssh_authorized_keys": SSH_KEY
          }

          with tempfile.NamedTemporaryFile(
              mode="w",
              suffix=".json",
              delete=False
          ) as f:
              json.dump(metadata, f)
              metadata_path = f.name

          try:
              for domain in domains:
                  ad = domain["name"]

                  print(
                      "Trying availability domain:",
                      ad,
                      flush=True
                  )

                  result = launch(ad, metadata_path)

                  if result.returncode == 0:
                      output = result.stdout.strip()

                      if not output:
                          raise RuntimeError(
                              "Launch returned empty output"
                          )

                      instance = json.loads(output)["data"]

                      print("INSTANCE CREATED")
                      print("Instance ID:", instance["id"])
                      print(
                          "State:",
                          instance["lifecycle-state"]
                      )
                      print(
                          "Future runs will skip this server."
                      )
                      sys.exit(0)

                  error = result.stderr

                  if (
                      "Out of host capacity" in error
                      or "Out of capacity" in error
                  ):
                      print(
                          "No A1 capacity in:",
                          ad,
                          flush=True
                      )
                      continue

                  print(error, file=sys.stderr)

                  raise RuntimeError(
                      "Launch failed for a reason "
                      "other than capacity"
                  )

              print(
                  "No A1 capacity available. "
                  "GitHub Actions will retry "
                  "on the next schedule."
              )

          finally:
              Path(metadata_path).unlink(missing_ok=True)

          PY
