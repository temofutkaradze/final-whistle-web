name: Oracle A1 - Always Free capacity attempt

"on":
  workflow_dispatch:
    inputs:
      audit_only:
        description: "READ-ONLY inventory/usage audit; never invokes provisioning or changes the safety issue"
        required: false
        default: false
        type: boolean
      reconcile_token:
        description: "Reconciliation ONLY: exact pending token from the dedicated safety issue"
        required: false
        default: ""
        type: string
      reconciliation_evidence:
        description: "Admin/maintainer attestation: OCI audit/support confirms no instance was created (20+ characters)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-a1-provision
  cancel-in-progress: false

jobs:
  provision:
    # Absent/false means no runner or OCI call; enable only after explicit approval.
    if: ${{ vars.OCI_A1_PROVISIONING_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.audit_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Mock-only safety regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts/oci -p 'test_*.py' -v
      - name: Install pinned OCI CLI
        run: python -m pip install --disable-pip-version-check 'oci-cli==3.96.0'
      - name: Verify free-tier safety and attempt one launch
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OCI_A1_PROVISIONING_ENABLED: ${{ vars.OCI_A1_PROVISIONING_ENABLED }}
          OCI_A1_STATE_ISSUE_NUMBER: ${{ vars.OCI_A1_STATE_ISSUE_NUMBER }}
          OCI_A1_RECONCILE_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile_token || '' }}
          OCI_A1_RECONCILIATION_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.reconciliation_evidence || '' }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/oci/provision_a1.py --execute

  audit:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.audit_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Mock-only audit and provisioning regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts/oci -p 'test_*.py' -v
      - name: Install pinned OCI SDK via existing CLI dependency
        run: python -m pip install --disable-pip-version-check 'oci-cli==3.96.0'
      - name: Read-only Oracle evidence audit
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OCI_A1_STATE_ISSUE_NUMBER: ${{ vars.OCI_A1_STATE_ISSUE_NUMBER }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/oci/audit_activation.py --execute --output "$RUNNER_TEMP/oracle-a1-audit.json"
      - name: Preserve redacted audit evidence even on partial reads
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: oracle-a1-read-only-audit
          path: ${{ runner.temp }}/oracle-a1-audit.json
          if-no-files-found: warn
          retention-days: 7
