
name: Oracle A1 - Auto Provision

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure Oracle credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo '[DEFAULT]'
            echo "user=$OCI_USER_OCID"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > ~/.oci/config

          chmod 600 ~/.oci/config

      - name: Check existing instances and launch
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tempfile

          def oci(*args):
              result = subprocess.run(
                  ["oci", *args, "--output", "json"],
                  text=True,
                  capture_output=True
              )
              if result.returncode:
                  print(result.stderr, file=sys.stderr)
                  raise RuntimeError("Oracle CLI command failed")
              return json.loads(result.stdout)

          root = os.environ["OCI_TENANCY_OCID"]
          compartment = os.environ["OCI_COMPARTMENT_OCID"]
          subnet = os.environ["OCI_SUBNET_OCID"]
          image = os.environ["OCI_IMAGE_OCID"]
          ssh_key = os.environ["OCI_SSH_PUBLIC_KEY"].strip()

          if not ssh_key.startswith("ssh-ed25519 "):
              raise RuntimeError("Invalid SSH public key")

          # Check both compartments before creating anything.
          for cid in dict.fromkeys([root, compartment]):
              instances = oci(
                  "compute", "instance", "list",
                  "--compartment-id", cid,
                  "--all"
              )["data"]

              for instance in instances:
                  if instance["lifecycle-state"] != "TERMINATED":
                      print(
                          "Existing instance found:",
                          instance["display-name"],
                          instance["lifecycle-state"]
                      )
                      print("Skipping launch to prevent duplicates.")
                      sys.exit(0)

          # Verify the requested subnet and image.
          oci("network", "subnet", "get", "--subnet-id", subnet)
          oci("compute", "image", "get", "--image-id", image)

          domains = oci(
              "iam", "availability-domain", "list",
              "--compartment-id", root
          )["data"]

          if not domains:
              raise RuntimeError("No availability domains found")

          metadata = {"ssh_authorized_keys": ssh_key}

          with tempfile.NamedTemporaryFile(
              mode="w", suffix=".json", delete=False
          ) as f:
              json.dump(metadata, f)
              metadata_file = f.name

          try:
              for domain in domains:
                  ad = domain["name"]
                  print("Trying availability domain:", ad, flush=True)

                  command = [
                      "oci", "compute", "instance", "launch",
                      "--compartment-id", compartment,
                      "--availability-domain", ad,
                      "--display-name", "final-whistle-server",
                      "--shape", "VM.Standard.A1.Flex",
                      "--shape-config",
                      '{"ocpus":2,"memoryInGBs":12}',
                      "--image-id", image,
                      "--subnet-id", subnet,
                      "--assign-public-ip", "true",
                      "--boot-volume-size-in-gbs", "50",
                      "--metadata", "file://" + metadata_file,
                      "--output", "json"
                  ]

                  result = subprocess.run(
                      command, text=True, capture_output=True
                  )

                  if result.returncode == 0:
                      instance = json.loads(result.stdout)["data"]
                      print("INSTANCE CREATED")
                      print("Instance OCID:", instance["id"])
                      print("State:", instance["lifecycle-state"])
                      sys.exit(0)

                  error = result.stderr
                  if "Out of host capacity" in error or \
                     "Out of capacity" in error:
                      print("No A1 capacity in", ad)
                      continue

                  print(error, file=sys.stderr)
                  raise RuntimeError(
                      "Launch failed for a reason other than capacity"
                  )

              print("No A1 capacity available. Retry next schedule.")

          finally:
              os.remove(metadata_file)
          PY
