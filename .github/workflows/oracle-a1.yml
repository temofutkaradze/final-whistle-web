
name: Oracle A1 - Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          {
            echo '[DEFAULT]'
            echo "user=$OCI_USER_OCID"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > ~/.oci/config

          chmod 600 ~/.oci/config

      - name: Test Oracle API connection
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        run: |
          oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --query 'data[].{Name:"display-name",State:"lifecycle-state"}' \
            --output table

          echo "Oracle API connection: OK"
