
name: Oracle A1 - Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-a1-provision
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install OCI CLI
        run: python3 -m pip install oci-cli

      - name: Configure Oracle credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          {
            echo '[DEFAULT]'
            echo "user=$OCI_USER_OCID"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > "$HOME/.oci/config"

          chmod 600 "$HOME/.oci/config"

      - name: Diagnose Oracle instance listing
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          ROOT = os.environ["OCI_TENANCY_OCID"]
          COMPARTMENT = os.environ["OCI_COMPARTMENT_OCID"]

          def run_oci(*args):
              command = ["oci", *args, "--output", "json"]

              result = subprocess.run(
                  command,
                  text=True,
                  capture_output=True
              )

              print(
                  "Command:",
                  " ".join(command[:3]),
                  flush=True
              )
              print(
                  "Return code:",
                  result.returncode,
                  flush=True
              )
              print(
                  "Stdout length:",
                  len(result.stdout),
                  flush=True
              )
              print(
                  "Stderr:",
                  result.stderr[:1500],
                  flush=True
              )

              if result.returncode != 0:
                  raise RuntimeError(
                      "Oracle CLI command failed"
                  )

              output = result.stdout.strip()

              if not output:
                  raise RuntimeError(
                      "Oracle CLI returned an empty response"
                  )

              try:
                  return json.loads(output)
              except json.JSONDecodeError:
                  print(
                      "Response is not valid JSON.",
                      flush=True
                  )
                  raise

          for name, cid in [
              ("ROOT", ROOT),
              ("FINAL_WHISTLE", COMPARTMENT)
          ]:
              print(
                  "\nChecking compartment:",
                  name,
                  flush=True
              )

              response = run_oci(
                  "compute",
                  "instance",
                  "list",
                  "--compartment-id",
                  cid,
                  "--all"
              )

              instances = response.get("data", [])

              print(
                  "Instance count:",
                  len(instances),
                  flush=True
              )

              for instance in instances:
                  print(
                      "Instance:",
                      instance.get("display-name"),
                      instance.get("lifecycle-state"),
                      flush=True
                  )

          print(
              "\nDIAGNOSTIC PASSED",
              flush=True
          )
          PY
