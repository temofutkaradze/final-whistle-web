<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
    <meta name="match-teams" content="{{HOME_NAME}} / {{AWAY_NAME}}">
    <title>Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
        .template-container { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #000; }
        .bg-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .league-logo { width: 72px; height: 56px; max-width: 72px; max-height: 56px; object-fit: contain; filter: brightness(0) invert(1) drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
        .league-logo.no-filter { filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
        .team { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
.team-logo { object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,.65)); }
        .score-text { color: #fff; font-weight: 900; white-space: nowrap; text-align: center; text-shadow: 0 5px 15px rgba(0,0,0,.75); }
        .branding { position: absolute; z-index: 5; color: #fff; text-transform: uppercase; white-space: pre-line; text-align: center; width: max-content; }
        .brand-logo { display: block; }

        .panel { position: absolute; left: 0; right: 0; bottom: 0; height: 580px; z-index: 2; background: rgba(9,12,16,.93); border-top: 3px solid rgba(255,255,255,.85); }
        .branding { top: 36px; left: 40px; font-size: 34px; font-weight: 800; font-style: italic; line-height: .92; letter-spacing: .5px; text-align: left; --brand-logo-h: 96px; --brand-logo-w: 300px; text-shadow: 0 3px 10px rgba(0,0,0,.6); }
        .scoreboard { position: absolute; left: 50%; top: 788px; transform: translateX(-50%); width: 940px; z-index: 5; }
        .league-section { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; height: 70px; }
        .league-line { flex: 1; height: 2px; background: {{LEAGUE_LINE_LEFT}}; }
        .league-line:last-child { background: {{LEAGUE_LINE_RIGHT}}; }
        .league-logo-wrapper { display: flex; align-items: center; justify-content: center; width: 150px; height: 70px; margin: 0 22px; }
        .teams-score { display: grid; grid-template-columns: 270px 400px 270px; align-items: center; }
        .team-logo-wrapper { width: 170px; height: 170px; margin-bottom: 0; display: flex; align-items: center; justify-content: center; }
        .team-logo { width: 170px; height: 170px; }
.score-text { font-size: 190px; line-height: .9; letter-spacing: -4px; }
        .scorers-section { display: grid; grid-template-columns: 1fr 1fr; gap: 90px; margin-top: 30px; }

        .team-scorers { display: flex; flex-direction: column; gap: 12px; width: 100%; min-height: 20px; max-height: 330px; overflow: hidden; }
        .team-scorers.left { align-items: flex-end; text-align: right; }
        .team-scorers.right { align-items: flex-start; text-align: left; }
        .event { display: flex; align-items: center; min-height: 30px; color: #fff; font-size: 24px; font-weight: 800; line-height: 1.15; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.85); }
        .team-scorers.left .event { justify-content: flex-end; }
        .team-scorers.right .event { justify-content: flex-start; }
        .player-name { display: inline-block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
        .minute { font-size: 20px; font-weight: 800; opacity: .9; }
        .sep { display: inline-block; margin: 0 10px; opacity: .55; font-weight: 600; }
        .pk-wrap { display: inline-flex; align-items: center; justify-content: center; margin: 0 6px; flex-shrink: 0; }
        .pk-wrap svg { display: block; }
        .goal-icon { display: inline-flex; align-items: center; justify-content: center; margin: 0 8px; font-size: 23px; line-height: 1; }
        .card-icon { position: relative; display: inline-block; width: 14px; height: 20px; margin: 0 9px; border-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,.5); flex-shrink: 0; }
        .card-icon.yellow { background: #ffd400; }
        .card-icon.red { background: #e50914; }
        .card-icon.second-yellow { width: 19px; height: 24px; background: transparent; box-shadow: none; }
        .card-icon.second-yellow::before, .card-icon.second-yellow::after { content: ""; position: absolute; width: 14px; height: 20px; border-radius: 2px; }
        .card-icon.second-yellow::before { left: 5px; top: 4px; background: #ffd400; box-shadow: 0 2px 5px rgba(0,0,0,.5); }
        .card-icon.second-yellow::after { left: 0; top: 0; background: #e50914; box-shadow: 0 2px 5px rgba(0,0,0,.55); }

    </style>
</head>
<body>
<div class="template-container">
    <img class="bg-image" src="{{BACKGROUND}}" alt="">
    <div class="panel"></div>
    <div class="branding">{{PAGE_NAME}}</div>
    <div class="scoreboard">
        <div class="league-section">
            <div class="league-line"></div>
            <div class="league-logo-wrapper"><img class="league-logo" src="{{LEAGUE_LOGO}}" alt=""></div>
            <div class="league-line"></div>
        </div>
        <div class="teams-score">
            <div class="team home-team">
                <div class="team-logo-wrapper"><img class="team-logo" src="{{HOME_LOGO}}" alt=""></div>

            </div>
            <div class="score-wrapper"><div class="score-text">{{HOME_SCORE}}:{{AWAY_SCORE}}</div></div>
            <div class="team away-team">
                <div class="team-logo-wrapper"><img class="team-logo" src="{{AWAY_LOGO}}" alt=""></div>

            </div>
        </div>
        <div class="scorers-section">
            <div class="team-scorers left">{{HOME_EVENTS}}</div>
            <div class="team-scorers right">{{AWAY_EVENTS}}</div>
        </div>
    </div>
</div>
</body>
</html>
