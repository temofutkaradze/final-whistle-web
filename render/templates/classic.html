<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">

    <title>Football Match Result</title>

    <!-- Montserrat -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,600;1,800;1,900&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 1080px;
            height: 1350px;
            overflow: hidden;
            background: #000;
            font-family: 'Montserrat', sans-serif;
        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .template-container {
            position: relative;

            width: 1080px;
            height: 1350px;

            overflow: hidden;

            background: #000;
        }


        /* =========================================================
           BACKGROUND IMAGE
        ========================================================= */

        .bg-image {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 1;
        }


        /* =========================================================
           DARK GRADIENT
        ========================================================= */

        .gradient-overlay {
            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;
            height: 60%;

            z-index: 2;

            background:
                linear-gradient(
                    to top,
                    rgba(0, 0, 0, 0.97) 0%,
                    rgba(0, 0, 0, 0.90) 25%,
                    rgba(0, 0, 0, 0.65) 55%,
                    rgba(0, 0, 0, 0.20) 85%,
                    rgba(0, 0, 0, 0) 100%
                );
        }


        /* =========================================================
           BRANDING
        ========================================================= */

        .branding {
            position: absolute;

            top: 3px;
            left: 20px;

            z-index: 5;

            color: #ffffff;

            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 900;
            font-style: italic;

            line-height: 0.88;

            letter-spacing: -1.25px;

            text-transform: uppercase;

            white-space: pre-line;

            width: max-content;

            text-align: center;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.55);
        }


        /* =========================================================
           SCOREBOARD
        ========================================================= */

        .scoreboard {
            position: absolute;

            left: 50%;
            top: 726px;

            transform: translateX(-50%);

            width: 900px;

            z-index: 5;
        }


        /* =========================================================
           LEAGUE
        ========================================================= */

        .league-section {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            margin-bottom: 30px;
        }


        .league-line {
            flex: 1;

            height: 2px;

            background: rgba(255, 255, 255, 0.45);
        }


        .league-logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 150px;
            height: 95px;

            margin: 0 25px;
        }


        .league-logo {
            max-width: 100px;
            max-height: 85px;

            object-fit: contain;

               filter:
                 brightness(0)
                 invert(1)
                 drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
        }


        .league-logo.no-filter {
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5));
        }


        /* =========================================================
           TEAMS + SCORE
        ========================================================= */

        .teams-score {
            display: grid;

            grid-template-columns: 260px 380px 260px;

            align-items: center;

            width: 100%;
        }


        /* =========================================================
           TEAM
        ========================================================= */

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-width: 0;
        }


        .team-logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 180px;
            height: 180px;

            margin-bottom: 15px;
        }


        .team-logo {
            width: 180px;
            height: 180px;

            object-fit: contain;

            filter:
                drop-shadow(0 5px 10px rgba(0, 0, 0, 0.65));
        }


        .team-name {
            width: 240px;

            color: #ffffff;

            font-size: 28px;
            font-weight: 800;

            line-height: 1.1;

            text-align: center;
            text-transform: uppercase;

            text-shadow:
                0 3px 8px rgba(0, 0, 0, 0.7);
        }


        /* =========================================================
           SCORE
        ========================================================= */

        .score-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 380px;
        }


        .score-text {
            color: #ffffff;

            font-size: 160px;
            font-weight: 900;

            line-height: 0.9;

            letter-spacing: -8px;

            white-space: nowrap;

            text-align: center;

            text-shadow:
                0 5px 15px rgba(0, 0, 0, 0.75);
        }


        /* =========================================================
           EVENTS / SCORERS
        ========================================================= */

        .scorers-section {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 110px;

            width: 100%;

            margin-top: 35px;
        }


        .team-scorers {
            display: flex;
            flex-direction: column;

            gap: 12px;

            width: 100%;

            min-height: 20px;

            max-height: 330px;

            overflow: hidden;
        }


        .team-scorers.left {
            align-items: flex-end;

            text-align: right;
        }


        .team-scorers.right {
            align-items: flex-start;

            text-align: left;
        }


        /* =========================================================
           EVENT ROW
        ========================================================= */

        .event {
            display: flex;
            align-items: center;

            min-height: 30px;

            color: #ffffff;

            font-size: 24px;
            font-weight: 800;

            line-height: 1.15;

            white-space: nowrap;

            text-shadow:
                0 2px 6px rgba(0, 0, 0, 0.85);
        }


        .team-scorers.left .event {
            justify-content: flex-end;
        }


        .team-scorers.right .event {
            justify-content: flex-start;
        }


        /* =========================================================
           PLAYER NAME
        ========================================================= */

        .player-name {
            display: inline-block;

            max-width: 280px;

            overflow: hidden;

            text-overflow: ellipsis;

            vertical-align: middle;
        }


        /* =========================================================
           MINUTE
        ========================================================= */

        .minute {
            font-size: 20px;
            font-weight: 800;

            opacity: 0.90;
        }


        /* =========================================================
           SEPARATOR
        ========================================================= */

        .sep {
            display: inline-block;

            margin: 0 10px;

            opacity: 0.55;

            font-weight: 600;
        }


        /* =========================================================
           PENALTY / MISSED PENALTY ICON
        ========================================================= */

        .pk-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin: 0 6px;

            flex-shrink: 0;
        }


        .pk-wrap svg {
            display: block;
        }


       /* =========================================================
           GOAL ICON
        ========================================================= */

        .goal-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin: 0 8px;

            font-size: 23px;

            line-height: 1;
        }


        /* =========================================================
           CARD ICON
        ========================================================= */

        .card-icon {
            position: relative;

            display: inline-block;

            width: 14px;
            height: 20px;

            margin: 0 9px;

            border-radius: 2px;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.5);

            flex-shrink: 0;
        }


        .card-icon.yellow {
            background: #ffd400;
        }


        .card-icon.red {
            background: #e50914;
        }


        /* მეორე ყვითელი: წითელი ბარათი წინ, ყვითელი უკან და ქვემოთ */

        .card-icon.second-yellow {
            width: 19px;
            height: 24px;

            margin: 0 9px;

            background: transparent;
            box-shadow: none;
        }


        .card-icon.second-yellow::before,
        .card-icon.second-yellow::after {
            content: "";

            position: absolute;

            width: 14px;
            height: 20px;

            border-radius: 2px;
        }


        /* უკანა ბარათი - ყვითელი (ქვემოთ და ოდნავ მარჯვნივ) */
        .card-icon.second-yellow::before {
            left: 5px;
            top: 4px;

            background: #ffd400;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.5);
        }


        /* წინა ბარათი - წითელი */
        .card-icon.second-yellow::after {
            left: 0;
            top: 0;

            background: #e50914;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.55);
        }


        /* =========================================================
           RESPONSIVE SAFETY
           Actual render remains 1080x1350.
        ========================================================= */

        img {
            user-select: none;
            -webkit-user-drag: none;
        }

    </style>
</head>


<body>

<div class="template-container">


    <!-- =========================================================
         BACKGROUND
    ========================================================== -->

    <img
        class="bg-image"
        src="{{BACKGROUND}}"
        alt=""
    >


    <!-- =========================================================
         DARK GRADIENT
    ========================================================== -->

    <div class="gradient-overlay"></div>


    <!-- =========================================================
         PAGE BRAND
    ========================================================== -->

    <div class="branding">
        {{PAGE_NAME}}
    </div>


    <!-- =========================================================
         SCOREBOARD
    ========================================================== -->

    <div class="scoreboard">


        <!-- =====================================================
             LEAGUE
        ====================================================== -->

        <div class="league-section">

            <div class="league-line"></div>

            <div class="league-logo-wrapper">

                <img
                    class="league-logo"
                    src="{{LEAGUE_LOGO}}"
                    alt=""
                >

            </div>

            <div class="league-line"></div>

        </div>


        <!-- =====================================================
             TEAMS + SCORE
        ====================================================== -->

        <div class="teams-score">


            <!-- =================================================
                 HOME TEAM
            ================================================== -->

            <div class="team home-team">

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        src="{{HOME_LOGO}}"
                        alt=""
                    >

                </div>

                <div class="team-name">
                    {{HOME_NAME}}
                </div>

            </div>


            <!-- =================================================
                 SCORE
            ================================================== -->

            <div class="score-wrapper">

                <div class="score-text">
                    {{HOME_SCORE}} - {{AWAY_SCORE}}
                </div>

            </div>


            <!-- =================================================
                 AWAY TEAM
            ================================================== -->

            <div class="team away-team">

                <div class="team-logo-wrapper">

                    <img
                        class="team-logo"
                        src="{{AWAY_LOGO}}"
                        alt=""
                    >

                </div>

                <div class="team-name">
                    {{AWAY_NAME}}
                </div>

            </div>


        </div>


        <!-- =====================================================
             MATCH EVENTS
        ====================================================== -->

        <div class="scorers-section">


            <!-- =================================================
                 HOME EVENTS
            ================================================== -->

            <div class="team-scorers left">

                {{HOME_EVENTS}}

            </div>


            <!-- =================================================
                 AWAY EVENTS
            ================================================== -->

            <div class="team-scorers right">

                {{AWAY_EVENTS}}

            </div>


        </div>


    </div>

</div>


</body>
</html>
